name: Pathway Paid Artefact Policy

on:
  pull_request:
    paths:
      - "src/lib/pathway-paid-artefact-policy.ts"
      - "src/lib/pathway-paid-artefact-policy.test.ts"
      - "src/lib/pathway-check-persistence.ts"
      - "src/lib/pathway-commercial-binding.ts"
      - ".github/workflows/pathway-paid-artefact-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run persistent paid artefact policy
        run: npx vitest run src/lib/pathway-paid-artefact-policy.test.ts
