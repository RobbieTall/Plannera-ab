name: Commercial Funnel Live Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN APPROVED READ-ONLY AUDIT to run the protected read-only audit.'
        required: true
        type: choice
        options:
          - RUN APPROVED READ-ONLY AUDIT

permissions:
  contents: read

concurrency:
  group: commercial-funnel-live-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN APPROVED READ-ONLY AUDIT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: commercial-funnel-audit
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --loglevel=error

      - name: Run safe commercial funnel audit
        id: audit
        if: ${{ steps.install.outcome == 'success' }}
        env:
          PLANNERA_AUDIT_BASE_URL: ${{ vars.PLANNERA_AUDIT_BASE_URL }}
          PLANNERA_AUDIT_ADMIN_TOKEN: ${{ secrets.PLANNERA_AUDIT_ADMIN_TOKEN }}
          PLANNERA_BYRON_PROJECT_ID: ${{ vars.PLANNERA_BYRON_PROJECT_ID }}
          PLANNERA_KEMPSEY_PROJECT_ID: ${{ vars.PLANNERA_KEMPSEY_PROJECT_ID }}
          PLANNERA_AUDIT_EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsx scripts/audit-commercial-funnel.ts > commercial-funnel-audit.json 2> commercial-funnel-audit.stderr
          status=$?
          set -e
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Validate safe JSON summary
        id: validate
        if: ${{ always() && steps.audit.outcome == 'success' }}
        shell: bash
        run: |
          node -e "const fs = require('node:fs'); const path = 'commercial-funnel-audit.json'; JSON.parse(fs.readFileSync(path, 'utf8'));"
          printf 'json_valid=true\n' >> "$GITHUB_OUTPUT"

      - name: Print validated safe summary
        if: ${{ steps.validate.outputs.json_valid == 'true' }}
        run: cat commercial-funnel-audit.json

      - name: Upload safe audit summary
        if: ${{ always() && steps.validate.outputs.json_valid == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: commercial-funnel-audit-summary
          path: commercial-funnel-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce audit gate
        if: ${{ always() }}
        shell: bash
        run: |
          install_outcome='${{ steps.install.outcome }}'
          audit_outcome='${{ steps.audit.outcome }}'
          json_valid='${{ steps.validate.outputs.json_valid }}'
          audit_exit='${{ steps.audit.outputs.exit_code }}'

          if [ "$install_outcome" != 'success' ]; then
            echo 'Configuration/contract failure: dependency installation did not complete.'
            exit 1
          fi
          if [ "$audit_outcome" != 'success' ]; then
            echo 'Configuration/contract failure: audit runner did not complete its controlled execution step.'
            exit 1
          fi
          if [ "$json_valid" != 'true' ]; then
            echo 'Configuration/contract failure: safe audit summary is absent or invalid JSON.'
            exit 1
          fi
          case "$audit_exit" in
            0)
              echo 'Commercial funnel audit gate passed: both independent golden projects reached an accepted terminal journey.'
              exit 0
              ;;
            1)
              echo 'Configuration/contract failure: audit runner exited 1.'
              exit 1
              ;;
            2)
              echo 'Valid non-ready gate: audit runner exited 2.'
              exit 1
              ;;
            *)
              echo 'Configuration/contract failure: audit runner exit output was missing or invalid.'
              exit 1
              ;;
          esac
