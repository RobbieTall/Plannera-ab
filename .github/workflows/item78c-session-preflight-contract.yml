name: Item 78C diagnostic synthetic contract

on:
  pull_request:
    paths:
      - .github/workflows/item77-protected-commercial-journey.yml
      - scripts/item78c-session-preflight*.mjs
      - tests/item78c-session-preflight*.test.mjs
      - .github/workflows/item78c-session-preflight*.yml

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test injected synthetic inputs only; no install, environment or cloud credentials
        run: node --test tests/item78c-session-preflight.test.mjs tests/item78c-session-preflight-authorize.test.mjs tests/item78c-session-preflight-wiring.test.mjs tests/item78c-session-preflight-presence.test.mjs
