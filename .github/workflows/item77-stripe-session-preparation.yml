name: Item 77 Stripe session preparation

on:
  pull_request:
    paths:
      - ".github/workflows/item77-stripe-session-preparation.yml"
      - ".github/workflows/stripe-test-session-prepare.yml"
      - "scripts/stripe-test-session-prepare.ts"
      - "src/lib/stripe-test-session-prepare.ts"
      - "tests/stripe-test-session-prepare.test.ts"

permissions:
  contents: read

concurrency:
  group: item77-stripe-session-preparation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify protected session preparation
        run: npx tsx --test tests/stripe-test-session-prepare.test.ts
