name: Pathway Persisted Commercial Binding

on:
  pull_request:
    paths:
      - "src/lib/pathway-persisted-commercial-binding.ts"
      - "src/lib/pathway-persisted-commercial-binding.test.ts"
      - "src/lib/pathway-check-persistence.ts"
      - "src/lib/pathway-commercial-binding.ts"
      - ".github/workflows/pathway-persisted-commercial-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run persisted commercial binding contract
        run: npx vitest run src/lib/pathway-persisted-commercial-binding.test.ts
