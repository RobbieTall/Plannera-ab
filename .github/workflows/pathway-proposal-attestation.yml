name: Pathway Proposal Attestation Contract

on:
  pull_request:
    paths:
      - "src/lib/pathway-proposal-attestation.ts"
      - "scripts/pathway-proposal-attestation.test.ts"
      - "docs/operations/pathway-proposal-attestation.md"
      - ".github/workflows/pathway-proposal-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation:
    name: User estimates remain evidence-gated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLANNING_PACK_CHECKOUT_ENABLED: "false"
      SUBMISSION_SEE_CHECKOUT_ENABLED: "false"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify proposal attestation boundary
        run: npx vitest run scripts/pathway-proposal-attestation.test.ts

      - name: Confirm Production checkout remains disabled
        run: |
          test "$PLANNING_PACK_CHECKOUT_ENABLED" = "false"
          test "$SUBMISSION_SEE_CHECKOUT_ENABLED" = "false"
