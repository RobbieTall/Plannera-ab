name: Pathway Private Evidence Package Assembly

on:
  pull_request:
    paths:
      - "src/lib/pathway-private-evidence-package-assembly.ts"
      - "src/lib/pathway-private-evidence-package-assembly.test.ts"
      - "scripts/item74h-evidence-package-preview-acceptance.ts"
      - "scripts/item74h-package-schema-preview-acceptance.ts"
      - "scripts/item74h-preview-migrate.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260828140000_item74h_private_evidence_package_assembly/migration.sql"
      - "prisma/migrations/20260829113000_item74h_package_assembly_hardening/migration.sql"
      - "docs/operations/item74h-private-evidence-package-assembly.md"
      - ".github/workflows/pathway-private-evidence-package-assembly.yml"
  push:
    branches:
      - "agent/item74h-pathway-check"
    paths:
      - "src/lib/pathway-private-evidence-package-assembly.ts"
      - "src/lib/pathway-private-evidence-package-assembly.test.ts"
      - "scripts/item74h-evidence-package-preview-acceptance.ts"
      - "scripts/item74h-package-schema-preview-acceptance.ts"
      - "scripts/item74h-preview-migrate.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260828140000_item74h_private_evidence_package_assembly/migration.sql"
      - "prisma/migrations/20260829113000_item74h_package_assembly_hardening/migration.sql"
      - "docs/operations/item74h-private-evidence-package-assembly.md"
      - ".github/workflows/pathway-private-evidence-package-assembly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLANNING_PACK_CHECKOUT_ENABLED: "false"
      SUBMISSION_SEE_CHECKOUT_ENABLED: "false"
      ITEM74H_EVIDENCE_PACKAGE_ACCEPTANCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/pathway-private-evidence-package-assembly.test.ts
      - run: npx tsx scripts/item74h-evidence-package-preview-acceptance.ts
      - run: npx tsx scripts/item74h-package-schema-preview-acceptance.ts
