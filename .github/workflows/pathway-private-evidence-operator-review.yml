name: Pathway Private Evidence Operator Review

on:
  pull_request:
    paths:
      - "src/lib/pathway-private-evidence-operator-review.ts"
      - "src/lib/pathway-private-evidence-operator-review.test.ts"
      - "scripts/item74h-operator-review-preview-acceptance.ts"
      - "scripts/item74h-preview-migrate.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260828100000_item74h_private_evidence_operator_review/migration.sql"
      - "docs/operations/item74h-private-evidence-operator-review.md"
      - ".github/workflows/pathway-private-evidence-operator-review.yml"
  push:
    branches:
      - "agent/item74h-pathway-check"
    paths:
      - "src/lib/pathway-private-evidence-operator-review.ts"
      - "src/lib/pathway-private-evidence-operator-review.test.ts"
      - "scripts/item74h-operator-review-preview-acceptance.ts"
      - "scripts/item74h-preview-migrate.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260828100000_item74h_private_evidence_operator_review/migration.sql"
      - "docs/operations/item74h-private-evidence-operator-review.md"
      - ".github/workflows/pathway-private-evidence-operator-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLANNING_PACK_CHECKOUT_ENABLED: "false"
      SUBMISSION_SEE_CHECKOUT_ENABLED: "false"
      ITEM74H_OPERATOR_REVIEW_ACCEPTANCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/pathway-private-evidence-operator-review.test.ts
      - run: npx tsx scripts/item74h-operator-review-preview-acceptance.ts
