name: Whole-LGA source matrix enforcement

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - agent/item74-launch-gate
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: whole-lga-matrix-enforcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-gate-contract:
    name: Verify protected whole-LGA matrix wiring and ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify protected Vercel matrix contract
        run: node ./scripts/verify-vercel-build-safety.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma client without database access
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
        run: node ./scripts/prisma-generate.js

      - name: Test whole-LGA ingestion boundaries
        run: npx vitest run --config vitest.config.ts src/lib/dcp/byron-ingestion.test.ts src/lib/dcp/kempsey-ingestion.test.ts src/app/api/admin/ingest-dcp/route.test.ts
