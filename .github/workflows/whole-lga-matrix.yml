name: Whole-LGA source matrix enforcement

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - agent/item74-launch-gate
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: whole-lga-matrix-enforcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-gate-contract:
    name: Verify protected whole-LGA matrix wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify protected Vercel matrix contract
        run: node -e "const p=require('./package.json'); const launch=p.scripts?.['smoke:launch']; const matrix=p.scripts?.['smoke:whole-lga']; const build=p.scripts?.['vercel-build']; const launchAt=build?.indexOf('npm run smoke:launch')??-1; const matrixAt=build?.indexOf('npm run smoke:whole-lga')??-1; const buildAt=build?.indexOf('next build')??-1; if(launch!=='tsx scripts/launch-smoke.ts'||matrix!=='tsx scripts/whole-lga-matrix-smoke.ts'||typeof build!=='string'||build.includes('db:push')||build.includes('prisma db push')||launchAt<0||matrixAt<0||buildAt<0||launchAt>matrixAt||matrixAt>buildAt) throw new Error('Vercel builds must stay schema-read-only and run launch then whole-LGA matrix before next build')"
