name: Item 77 protected commercial journey

on:
  pull_request:
    paths:
      - ".github/workflows/item77-protected-commercial-journey.yml"
      - "src/app/internal/item74h-commercial-acceptance/page.tsx"
      - "src/components/projects/see-document-panel.tsx"
      - "src/lib/item74h-visual-acceptance.ts"
      - "tests/see-document-panel.test.tsx"
      - "src/lib/stripe-test-acceptance.ts"
      - "tests/stripe-test-acceptance.test.ts"
      - "src/lib/submission-see-credit.ts"
      - "src/lib/submission-see-credit.test.ts"
      - "src/lib/item74h-progressive-evidence-regeneration.ts"
      - "src/lib/item74h-progressive-evidence-regeneration.test.ts"
      - "src/lib/submission-see-renderer.ts"
      - "src/lib/submission-see-renderer.test.ts"
      - "scripts/item74h-working-see-preview-acceptance.ts"
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run only the protected read-only Item 78C saved-login diagnostic
        type: boolean
        required: false
        default: false
      presence_only:
        description: With diagnostic_only, check setting presence only; no database connection
        type: boolean
        required: false
        default: false
      expected_commit:
        description: Required for diagnostic mode; exact reviewed non-main commit
        type: string
        required: false
      confirmation:
        description: Diagnostic mode requires READ ONLY PREVIEW LOGIN CHECK
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.presence_only && 'item78c-presence-only' || format('item77-protected-commercial-journey-{0}-{1}', github.ref, inputs.diagnostic_only && 'diagnostic' || 'contracts') }}
  cancel-in-progress: ${{ !inputs.diagnostic_only && !inputs.presence_only }}

jobs:
  commercial-journey:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.diagnostic_only && !inputs.presence_only) }}
    name: Exact scope, credit, evidence, outputs and UI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Stripe test lifecycle contract
        run: npx tsx --test tests/stripe-test-acceptance.test.ts
      - name: Verify credit, evidence, rendering and progressive disclosure
        run: >-
          npx vitest run
          src/lib/submission-see-credit.test.ts
          src/lib/item74h-progressive-evidence-regeneration.test.ts
          src/lib/submission-see-renderer.test.ts
          src/lib/item74h-visual-acceptance.test.ts
          tests/see-document-panel.test.tsx
      - name: Verify qualified working DOCX/PDF regeneration
        run: npm run --silent accept:item74h-working-see-preview

  session-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && !inputs.presence_only }}
    name: Read-only ${{ matrix.council }} login check
    needs: session-authorize
    permissions:
      contents: read
      actions: read
    env:
      ITEM78C_DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_commit }}
      ITEM78C_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - council: BYRON
            environment: item78c-byron-preview
          - council: KEMPSEY
            environment: item78c-kempsey-preview
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck protections and environment commit pin
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM78C_DIAGNOSTIC_COUNCIL: ${{ matrix.council }}
          ITEM74H_WORKFLOW_AUTHORIZED_COMMIT: ${{ vars.ITEM74H_WORKFLOW_AUTHORIZED_COMMIT }}
          ITEM74H_AUTHORIZED_DATABASE_TARGET: ${{ vars.ITEM74H_AUTHORIZED_DATABASE_TARGET }}
        run: node scripts/item78c-session-preflight-authorize.mjs protected
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install without lifecycle scripts or application credentials
        run: npm ci --ignore-scripts --loglevel=error
      - name: Generate Prisma client with synthetic configuration
        env:
          DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/synthetic
        run: ./node_modules/.bin/prisma generate
      - name: Read session/project match
        id: diagnostic
        continue-on-error: true
        env:
          ITEM78C_DIAGNOSTIC_COUNCIL: ${{ matrix.council }}
          ITEM74H_PREVIEW_DATABASE_URL: ${{ secrets.ITEM74H_PREVIEW_DATABASE_URL }}
          PLANNERA_STRIPE_TEST_SESSION_COOKIE: ${{ secrets.PLANNERA_STRIPE_TEST_SESSION_COOKIE }}
          DEBUG: ''
        run: node scripts/item78c-session-preflight.mjs > item78c-session-preflight.json 2> item78c-session-preflight.stderr
      - name: Emit allowlisted result only
        if: ${{ !cancelled() && steps.diagnostic.outcome != 'skipped' }}
        run: node scripts/item78c-session-preflight-authorize.mjs summary
      - name: Remove temporary output without uploading it
        if: ${{ always() }}
        run: rm -f -- item78c-session-preflight.json item78c-session-preflight.stderr

  session-authorize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && !inputs.presence_only }}
    name: Authorize without application credentials
    permissions:
      contents: read
      actions: read
    env:
      ITEM78C_DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_commit }}
      ITEM78C_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit evidence and both environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/item78c-session-preflight-authorize.mjs credential-free
      - name: Synthetic diagnostic regression tests
        run: node --test tests/item78c-session-preflight*.test.mjs

  presence-authorize:
    name: Authorize presence-only probe without application credentials
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.presence_only }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ITEM78C_DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_commit }}
      ITEM78C_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit diagnostic-only selection
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
        run: node -e 'if (process.env.DIAGNOSTIC_ONLY !== "true") process.exit(1)'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit evidence and both environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/item78c-session-preflight-authorize.mjs credential-free
      - name: Synthetic diagnostic and presence regression tests
        run: node --test tests/item78c-session-preflight*.test.mjs

  presence:
    name: Presence only for ${{ matrix.council }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && inputs.presence_only }}
    needs: presence-authorize
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - council: BYRON
            environment: item78c-byron-preview
          - council: KEMPSEY
            environment: item78c-kempsey-preview
    environment: ${{ matrix.environment }}
    env:
      ITEM78C_DIAGNOSTIC_EXPECTED_SHA: ${{ inputs.expected_commit }}
      ITEM78C_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck protections and environment commit pin
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM78C_DIAGNOSTIC_COUNCIL: ${{ matrix.council }}
          ITEM74H_WORKFLOW_AUTHORIZED_COMMIT: ${{ vars.ITEM74H_WORKFLOW_AUTHORIZED_COMMIT }}
          ITEM74H_AUTHORIZED_DATABASE_TARGET: ${{ vars.ITEM74H_AUTHORIZED_DATABASE_TARGET }}
        run: node scripts/item78c-session-preflight-authorize.mjs protected
      - name: Report two presence flags only
        env:
          DATABASE_CONFIGURED: ${{ secrets.ITEM74H_PREVIEW_DATABASE_URL != '' }}
          SESSION_CONFIGURED: ${{ secrets.PLANNERA_STRIPE_TEST_SESSION_COOKIE != '' }}
        run: node scripts/item78c-session-preflight-presence.mjs
