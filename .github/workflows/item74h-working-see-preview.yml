name: Item 74H Working SEE Preview Gate

on:
  pull_request:
    paths:
      - "src/lib/submission-see-renderer.ts"
      - "src/lib/submission-see-renderer.test.ts"
      - "scripts/item74h-working-see-preview-acceptance.ts"
      - "package.json"
      - ".github/workflows/item74h-working-see-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: item74h-working-see-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  working-see-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --loglevel=error

      - name: Generate Prisma client without database access
        run: ./node_modules/.bin/prisma generate

      - name: Prove qualified and strengthened working outputs
        run: npm run accept:item74h-working-see-preview

      - name: Prove renderer safety boundaries
        run: ./node_modules/.bin/vitest run --config vitest.config.ts src/lib/submission-see-renderer.test.ts
