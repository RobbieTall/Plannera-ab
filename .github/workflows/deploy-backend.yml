name: Deploy Backend (DRME Journal)

on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/journal**'
      - 'src/app/api/insights**'
      - 'src/app/api/numerology**'
      - 'src/app/api/astrology**'
      - 'src/app/api/patterns**'
      - 'src/app/api/reminders**'
      - 'src/app/api/journal-users**'
      - 'src/app/api/health**'
      - 'db/**'
      - 'lib/**'
      - 'drizzle.config.ts'
      - 'package.json'
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --project tsconfig.build.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
