name: Item 74H Progressive Commercial Bridge

on:
  pull_request:
    paths:
      - "src/lib/pathway-progressive-commercial-binding.ts"
      - "src/lib/pathway-progressive-commercial-binding.test.ts"
      - "src/lib/pathway-check-persistence.ts"
      - "src/lib/pathway-customer-result.ts"
      - "src/lib/pathway-customer-result.test.ts"
      - "scripts/item74h-public-da-persistence-preview.ts"
      - ".github/workflows/pathway-progressive-commercial-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: item74h-progressive-commercial-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  progressive-commercial-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --loglevel=error

      - name: Generate Prisma client without database access
        run: ./node_modules/.bin/prisma generate

      - name: Prove progressive binding and customer readiness
        run: ./node_modules/.bin/vitest run --config vitest.config.ts src/lib/pathway-progressive-commercial-binding.test.ts src/lib/pathway-customer-result.test.ts
