name: Item 74H progressive evidence regeneration

on:
  pull_request:
    paths:
      - ".github/workflows/item74h-progressive-evidence-regeneration.yml"
      - "docs/operations/item74h-progressive-evidence-regeneration.md"
      - "src/app/internal/item74h-commercial-acceptance/page.tsx"
      - "src/lib/item74h-progressive-evidence-regeneration.ts"
      - "src/lib/item74h-progressive-evidence-regeneration.test.ts"
      - "src/lib/item74h-visual-acceptance.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: item74h-progressive-evidence-regeneration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progressive-evidence-regeneration:
    name: Progressive evidence regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify same-project evidence and working products
        run: >-
          npx vitest run
          src/lib/item74h-progressive-evidence-regeneration.test.ts
          src/lib/item74h-candidate-reviewed-pathway.test.ts
          src/lib/pathway-progressive-commercial-binding.test.ts
          src/lib/pathway-commercial-presentation.test.ts
