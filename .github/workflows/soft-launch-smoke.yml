name: Soft launch smoke enforcement

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: soft-launch-smoke-enforcement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-gate-contract:
    name: Verify Vercel launch gate wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Verify protected Vercel smoke contract
        run: node -e "const p=require('./package.json'); const smoke=p.scripts?.['smoke:launch']; const build=p.scripts?.['vercel-build']; if(smoke!=='tsx scripts/launch-smoke.ts'||typeof build!=='string'||build.includes('db:push')||build.includes('prisma db push')||!build.includes('npm run smoke:launch')||build.indexOf('npm run smoke:launch')>build.indexOf('next build')) throw new Error('Vercel builds must be schema-read-only and run npm run smoke:launch before next build')"
