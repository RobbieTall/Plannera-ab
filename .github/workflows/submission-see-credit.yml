name: Submission SEE Credit Contract

on:
  pull_request:
    paths:
      - "src/lib/submission-see-credit.ts"
      - "src/lib/submission-see-credit.test.ts"
      - ".github/workflows/submission-see-credit.yml"
      - "docs/operations/item74f-submission-see-credit.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-see-credit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credit-contract:
    name: Exact-scope A$49 SEE credit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --loglevel=error

      - name: Generate Prisma client without database access
        run: ./node_modules/.bin/prisma generate

      - name: Run exact-scope credit contract tests
        run: npx vitest run src/lib/submission-see-credit.test.ts
