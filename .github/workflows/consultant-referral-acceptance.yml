name: Consultant Referral Non-production Acceptance

on:
  workflow_dispatch:
    inputs:
      repair_preview_only:
        description: Regenerate only the existing Kempsey Preview review package; no referral submission
        required: false
        default: false
        type: boolean
      expected_commit:
        description: Exact reviewed diagnostic commit; required for repair mode
        required: false
        type: string
      confirmation:
        description: Confirm one synthetic referral through the protected human queue.
        required: true
        type: choice
        options:
          - RUN CONSULTANT REFERRAL ACCEPTANCE
          - REGENERATE PREVIEW REVIEW PACKAGE
      target_confirmation:
        description: Confirm the target is protected and non-production.
        required: true
        type: choice
        options:
          - PROTECTED NON-PRODUCTION
      project_id:
        description: Legacy project ID; ignored by repair mode, which uses protected environment values.
        required: true
        type: string
      review_request_artefact_id:
        description: Legacy review ID; ignored by repair mode.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: consultant-referral-test-acceptance
  cancel-in-progress: false

jobs:
  accept:
    if: ${{ !inputs.repair_preview_only && github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN CONSULTANT REFERRAL ACCEPTANCE' && inputs.target_confirmation == 'PROTECTED NON-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: consultant-referral-test-acceptance
    steps:
      - name: Checkout exact dispatched release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node v6.4.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --loglevel=error
      - name: Generate Prisma client without database access
        run: ./node_modules/.bin/prisma generate
      - name: Run fail-closed acceptance
        id: acceptance
        continue-on-error: true
        env:
          PLANNERA_REFERRAL_TEST_CONFIRMATION: ${{ inputs.confirmation }}
          PLANNERA_REFERRAL_TEST_TARGET: ${{ inputs.target_confirmation }}
          PLANNERA_REFERRAL_TEST_PROJECT_ID: ${{ inputs.project_id }}
          PLANNERA_REFERRAL_TEST_REVIEW_REQUEST_ARTEFACT_ID: ${{ inputs.review_request_artefact_id }}
          PLANNERA_REFERRAL_TEST_BASE_URL: ${{ vars.PLANNERA_REFERRAL_TEST_BASE_URL }}
          PLANNERA_REFERRAL_TEST_ALLOWED_BASE_URL: ${{ vars.PLANNERA_REFERRAL_TEST_ALLOWED_BASE_URL }}
          PLANNERA_REFERRAL_TEST_SESSION_COOKIE: ${{ secrets.PLANNERA_REFERRAL_TEST_SESSION_COOKIE }}
          PLANNERA_REFERRAL_TEST_VERCEL_BYPASS: ${{ secrets.PLANNERA_REFERRAL_TEST_VERCEL_BYPASS }}
          PLANNERA_REFERRAL_TEST_ADMIN_TOKEN: ${{ secrets.PLANNERA_REFERRAL_TEST_ADMIN_TOKEN }}
        run: npm run --silent accept:consultant-referral > consultant-referral-acceptance.json
      - name: Validate privacy-minimal summary
        run: |
          node -e "const s=require('./consultant-referral-acceptance.json'); const top=['checks','opaque','passed','reason','runnerVersion','statuses'].sort(); const checks=['cleanup','configuration','operatorQueue','preflightEmpty','submitted','transitions','userStatus'].sort(); const opaque=['packageDigest','referralId','reviewRequestArtefactId'].sort(); const reasons=['configuration_invalid','target_denied','application_request_failed','application_contract_invalid','preexisting_referral','submission_failed','queue_verification_failed','transition_failed','user_status_failed','cleanup_failed','acceptance_unhandled_failure']; const reasonOk=(s.passed===true&&s.reason===null)||(s.passed===false&&reasons.includes(s.reason)); const safe=JSON.stringify(s); if(s.runnerVersion!=='consultant_referral_acceptance.v1'||typeof s.passed!=='boolean'||!reasonOk||JSON.stringify(Object.keys(s).sort())!==JSON.stringify(top)||JSON.stringify(Object.keys(s.checks||{}).sort())!==JSON.stringify(checks)||JSON.stringify(Object.keys(s.opaque||{}).sort())!==JSON.stringify(opaque)||Object.values(s.checks||{}).some(v=>typeof v!=='boolean')||/@|contactName|contactEmail|packageSnapshot/i.test(safe)) process.exit(1)"
      - name: Write safe job summary
        run: |
          node -e "const s=require('./consultant-referral-acceptance.json'); process.stdout.write('Consultant referral acceptance: passed='+s.passed+'; reason='+(s.reason||'none')+'; statuses='+s.statuses.join(' > ')+'\n')" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload safe acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: consultant-referral-acceptance-summary
          path: consultant-referral-acceptance.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce acceptance result
        run: node -e "const s=require('./consultant-referral-acceptance.json'); if(s.passed!==true) process.exit(1)"

  repair-authorize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_preview_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      ITEM78C_REFERRAL_REPAIR_ONLY: ${{ inputs.repair_preview_only }}
      ITEM78C_REFERRAL_REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
      ITEM78C_REFERRAL_REPAIR_EXPECTED_SHA: ${{ inputs.expected_commit }}
      ITEM78C_REFERRAL_REPAIR_TARGET: ${{ inputs.target_confirmation }}
      PLANNING_PACK_CHECKOUT_ENABLED: 'false'
      SUBMISSION_SEE_CHECKOUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact commit, Preview protections and no active whole-funnel run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/item78c-referral-repair-authorize.mjs credential-free
      - name: Run synthetic repair tests without application credentials
        run: node --test tests/item78c-referral-repair.test.mjs

  repair-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_preview_only }}
    needs: repair-authorize
    environment: item78c-kempsey-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    env:
      ITEM78C_REFERRAL_REPAIR_ONLY: ${{ inputs.repair_preview_only }}
      ITEM78C_REFERRAL_REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
      ITEM78C_REFERRAL_REPAIR_EXPECTED_SHA: ${{ inputs.expected_commit }}
      ITEM78C_REFERRAL_REPAIR_TARGET: ${{ inputs.target_confirmation }}
      ITEM78C_REFERRAL_REPAIR_AUTHORIZED_COMMIT: ${{ vars.ITEM78C_REFERRAL_REPAIR_AUTHORIZED_COMMIT }}
      ITEM74H_WORKFLOW_AUTHORIZED_COMMIT: ${{ vars.ITEM74H_WORKFLOW_AUTHORIZED_COMMIT }}
      ITEM74H_PREVIEW_MUTATION_APPROVED: ${{ vars.ITEM74H_PREVIEW_MUTATION_APPROVED }}
      ITEM74H_AUTHORIZED_DATABASE_TARGET: ${{ vars.ITEM74H_AUTHORIZED_DATABASE_TARGET }}
      PLANNING_PACK_CHECKOUT_ENABLED: 'false'
      SUBMISSION_SEE_CHECKOUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck protected repair pin before application credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/item78c-referral-repair-authorize.mjs protected
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Regenerate or recover one bound review; never submit a referral
        id: repair
        continue-on-error: true
        env:
          PLANNERA_REFERRAL_TEST_BASE_URL: ${{ vars.PLANNERA_REFERRAL_TEST_BASE_URL }}
          PLANNERA_REFERRAL_TEST_ALLOWED_BASE_URL: ${{ vars.PLANNERA_REFERRAL_TEST_ALLOWED_BASE_URL }}
          PLANNERA_REFERRAL_TEST_PROJECT_ID: ${{ vars.PLANNERA_REFERRAL_TEST_PROJECT_ID }}
          PLANNERA_REFERRAL_TEST_REVIEW_REQUEST_ARTEFACT_ID: ${{ vars.PLANNERA_REFERRAL_TEST_REVIEW_REQUEST_ARTEFACT_ID }}
          PLANNERA_REFERRAL_TEST_SESSION_COOKIE: ${{ secrets.PLANNERA_REFERRAL_TEST_SESSION_COOKIE }}
          PLANNERA_REFERRAL_TEST_VERCEL_BYPASS: ${{ secrets.PLANNERA_REFERRAL_TEST_VERCEL_BYPASS }}
          NODE_OPTIONS: ''
          DEBUG: ''
        run: |
          umask 077
          node scripts/item78c-referral-repair.mjs > "$RUNNER_TEMP/item78c-referral-repair.json" 2> "$RUNNER_TEMP/item78c-referral-repair.stderr"
      - name: Emit only allowlisted booleans and reason codes without credentials
        if: ${{ !cancelled() && steps.repair.outcome != 'skipped' }}
        run: node scripts/item78c-referral-repair.mjs --summary
      - name: Remove private temporary output
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/item78c-referral-repair.json" "$RUNNER_TEMP/item78c-referral-repair.stderr"

